[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-router"
version = "0.1.0"
description = "Smart LLM API Router — intelligent routing, load balancing, fallback, cost optimization for multiple AI providers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Arris-1-a", email = "lichen153532@gmail.com"},
]
keywords = ["llm", "router", "rag", "agent", "openai", "anthropic", "deepseek", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.6.0",
    "tenacity>=8.3.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "redis>=5.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "typer>=0.12.0",
    "aiofiles>=23.2.0",
    "structlog>=24.1.0",
    "sentence-transformers>=2.7.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.8.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "coverage>=7.5.0",
    "httpx>=0.27.0",
]
all = [
    "ai-router[dev]",
    "faiss-cpu>=1.8.0",
    "chromadb>=0.5.0",
    "pinecone-client>=3.2.0",
    "langfuse>=2.30.0",
]

[project.scripts]
ai-router = "ai_router.cli:app"

[project.urls]
Homepage = "https://github.com/Arris-1-a/ai-router"
Repository = "https://github.com/Arris-1-a/ai-router"
Issues = "https://github.com/Arris-1-a/ai-router/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=ai_router --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["ai_router"]
omit = ["tests/*"]
